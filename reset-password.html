<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Artheim</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Additional styles specific to reset password page */
        .reset-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .reset-card {
            background: rgba(0, 30, 50, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
        }
        
        .reset-title {
            text-align: center;
            color: #ffd700;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .reset-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            color: white;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .reset-input:focus {
            outline: none;
            border-color: #ffd700;
            background: rgba(0, 0, 0, 0.6);
        }
        
        .reset-btn {
            width: 100%;
            padding: 12px;
            background: #4a6a8a;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        
        .reset-btn:hover {
            background: #5a7a9a;
        }
        
        .message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }
        
        .message.success {
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
            border: 1px solid #4caf50;
        }
        
        .message.error {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
            border: 1px solid #f44336;
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .back-link a {
            color: #ffd700;
            text-decoration: none;
            font-size: 14px;
        }
        
        .back-link a:hover {
            text-decoration: underline;
        }
        
        .password-strength {
            font-size: 12px;
            margin-top: 5px;
            padding-left: 5px;
        }
        
        .strength-weak { color: #f44336; }
        .strength-medium { color: #ff9800; }
        .strength-strong { color: #4caf50; }
        
        @media (max-width: 768px) {
            .reset-card {
                padding: 25px;
            }
            .reset-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-card">
            <h1 class="reset-title">🔐 Reset Password</h1>
            
            <div class="input-group">
                <input type="password" id="new-password" class="reset-input" placeholder="New Password (min 6 characters)">
                <div id="password-strength" class="password-strength"></div>
            </div>
            
            <div class="input-group">
                <input type="password" id="confirm-password" class="reset-input" placeholder="Confirm New Password">
            </div>
            
            <button id="reset-password-btn" class="reset-btn">Reset Password</button>
            
            <div id="reset-message" class="message"></div>
            
            <div class="back-link">
                <a href="/index.html">← Back to Login</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Supabase configuration
        const SUPABASE_URL = 'https://qzxvwoyigrrpdywvhckk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ncHOn7TNowbRZS9s-RYeuA_2m8ka_Iu';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // DOM elements
        const newPasswordInput = document.getElementById('new-password');
        const confirmPasswordInput = document.getElementById('confirm-password');
        const resetBtn = document.getElementById('reset-password-btn');
        const messageDiv = document.getElementById('reset-message');
        const strengthDiv = document.getElementById('password-strength');
        
        // Password strength checker
        function checkPasswordStrength(password) {
            if (!password) return { text: '', class: '' };
            
            let strength = 0;
            if (password.length >= 8) strength++;
            if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength++;
            if (password.match(/[0-9]/)) strength++;
            if (password.match(/[^a-zA-Z0-9]/)) strength++;
            
            if (strength <= 1) return { text: 'Weak password', class: 'strength-weak' };
            if (strength === 2) return { text: 'Medium password', class: 'strength-medium' };
            return { text: 'Strong password', class: 'strength-strong' };
        }
        
        // Show password strength as user types
        newPasswordInput.addEventListener('input', (e) => {
            const strength = checkPasswordStrength(e.target.value);
            strengthDiv.textContent = strength.text;
            strengthDiv.className = `password-strength ${strength.class}`;
        });
        
        // Reset password function
        async function resetPassword() {
            const newPassword = newPasswordInput.value.trim();
            const confirmPassword = confirmPasswordInput.value.trim();
            
            // Clear previous message
            messageDiv.innerHTML = '';
            messageDiv.className = 'message';
            
            // Validation
            if (!newPassword || !confirmPassword) {
                showMessage('Please fill in both fields', 'error');
                return;
            }
            
            if (newPassword.length < 6) {
                showMessage('Password must be at least 6 characters', 'error');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                showMessage('Passwords do not match', 'error');
                return;
            }
            
            // Show loading state
            resetBtn.disabled = true;
            resetBtn.textContent = 'Updating...';
            showMessage('Updating your password...', 'success');
            
            try {
                // Update the user's password
                const { error } = await supabase.auth.updateUser({
                    password: newPassword
                });
                
                if (error) {
                    console.error('Reset error:', error);
                    showMessage(error.message || 'Failed to reset password. Please try again.', 'error');
                } else {
                    showMessage('✅ Password updated successfully! Redirecting to login...', 'success');
                    
                    // Redirect to login page after 2 seconds
                    setTimeout(() => {
                        window.location.href = '/index.html';
                    }, 2000);
                }
            } catch (error) {
                console.error('Unexpected error:', error);
                showMessage('An unexpected error occurred. Please try again.', 'error');
            } finally {
                resetBtn.disabled = false;
                resetBtn.textContent = 'Reset Password';
            }
        }
        
        // Helper function to show messages
        function showMessage(text, type) {
            messageDiv.innerHTML = text;
            messageDiv.className = `message ${type}`;
        }
        
        // Check if we have the access token from the URL hash
        function checkForAccessToken() {
            const hash = window.location.hash;
            if (!hash || !hash.includes('access_token')) {
                showMessage('Invalid or missing reset link. Please request a new password reset.', 'error');
                resetBtn.disabled = true;
                resetBtn.style.opacity = '0.5';
                return false;
            }
            return true;
        }
        
        // Add event listener
        resetBtn.addEventListener('click', resetPassword);
        
        // Also allow Enter key to submit
        confirmPasswordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                resetPassword();
            }
        });
        
        // Check for access token on page load
        checkForAccessToken();
        
        // Also handle the hash for Supabase (it automatically processes it)
        // Supabase will automatically handle the access token from the URL
        console.log('Reset password page loaded');
    </script>
</body>
</html>
