<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Artheim</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            background-image: url('map.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 0;
        }
        
        .reset-container {
            position: relative;
            z-index: 1;
            max-width: 500px;
            width: 90%;
            padding: 40px 20px;
        }
        
        .reset-card {
            background: rgba(0, 30, 50, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            text-align: center;
            color: #ffd700;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        
        input:focus {
            outline: none;
            border-color: #ffd700;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: #4a6a8a;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #5a7a9a;
        }
        
        .message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }
        
        .message.success {
            background: rgba(76, 175, 80, 0.3);
            color: #4caf50;
            border: 1px solid #4caf50;
        }
        
        .message.error {
            background: rgba(244, 67, 54, 0.3);
            color: #f44336;
            border: 1px solid #f44336;
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .back-link a {
            color: #ffd700;
            text-decoration: none;
        }
        
        .back-link a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .reset-card {
                padding: 25px;
            }
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-card">
            <h1>🔐 Reset Password</h1>
            
            <div class="input-group">
                <input type="password" id="new-password" placeholder="New Password (min 6 characters)">
            </div>
            
            <div class="input-group">
                <input type="password" id="confirm-password" placeholder="Confirm New Password">
            </div>
            
            <button id="reset-btn">Reset Password</button>
            
            <div id="message" class="message"></div>
            
            <div class="back-link">
                <a href="/index.html">← Back to Login</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        (function() {
            const SUPABASE_URL = 'https://qzxvwoyigrrpdywvhckk.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_ncHOn7TNowbRZS9s-RYeuA_2m8ka_Iu';
            const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            
            function getAccessToken() {
                const hashParams = new URLSearchParams(window.location.hash.substring(1));
                return hashParams.get('access_token');
            }
            
            async function resetPassword() {
                const newPassword = document.getElementById('new-password').value;
                const confirmPassword = document.getElementById('confirm-password').value;
                const messageDiv = document.getElementById('message');
                
                messageDiv.innerHTML = '';
                messageDiv.className = 'message';
                
                if (!newPassword || !confirmPassword) {
                    messageDiv.innerHTML = 'Please fill in both fields';
                    messageDiv.className = 'message error';
                    return;
                }
                
                if (newPassword.length < 6) {
                    messageDiv.innerHTML = 'Password must be at least 6 characters';
                    messageDiv.className = 'message error';
                    return;
                }
                
                if (newPassword !== confirmPassword) {
                    messageDiv.innerHTML = 'Passwords do not match';
                    messageDiv.className = 'message error';
                    return;
                }
                
                const btn = document.getElementById('reset-btn');
                btn.disabled = true;
                btn.textContent = 'Updating...';
                messageDiv.innerHTML = 'Updating password...';
                messageDiv.className = 'message';
                
                try {
                    const { error } = await _supabase.auth.updateUser({
                        password: newPassword
                    });
                    
                    if (error) {
                        messageDiv.innerHTML = error.message || 'Failed to update password';
                        messageDiv.className = 'message error';
                    } else {
                        messageDiv.innerHTML = '✅ Password updated successfully! Redirecting to login...';
                        messageDiv.className = 'message success';
                        
                        setTimeout(() => {
                            window.location.href = '/index.html';
                        }, 2000);
                    }
                } catch (err) {
                    messageDiv.innerHTML = 'An unexpected error occurred';
                    messageDiv.className = 'message error';
                } finally {
                    btn.disabled = false;
                    btn.textContent = 'Reset Password';
                }
            }
            
            const token = getAccessToken();
            if (!token) {
                const msgDiv = document.getElementById('message');
                if (msgDiv) {
                    msgDiv.innerHTML = 'Invalid or expired reset link. Please request a new password reset.';
                    msgDiv.className = 'message error';
                }
                const resetBtn = document.getElementById('reset-btn');
                if (resetBtn) resetBtn.disabled = true;
            }
            
            const resetBtn = document.getElementById('reset-btn');
            if (resetBtn) {
                resetBtn.addEventListener('click', resetPassword);
            }
            
            const confirmInput = document.getElementById('confirm-password');
            if (confirmInput) {
                confirmInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') resetPassword();
                });
            }
        })();
    </script>
</body>
</html>
