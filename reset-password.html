<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password - Artheim</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: linear-gradient(135deg, #0a0a2a 0%, #1a1a3a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        .reset-container {
            background: rgba(0, 30, 180, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            width: 400px;
            max-width: 90%;
            text-align: center;
            border: 1px solid gold;
        }
        h1 {
            color: gold;
            margin-bottom: 20px;
        }
        p {
            color: white;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 8px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background: #4a6a8a;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover {
            background: #5a7a9a;
        }
        .message {
            margin-top: 15px;
            color: #ffd700;
        }
        .error {
            color: #ff8888;
        }
        .success {
            color: #4caf50;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <h1>Reset Password</h1>
        <p>Enter your new password below</p>
        <input type="password" id="new-password" placeholder="New password">
        <input type="password" id="confirm-password" placeholder="Confirm new password">
        <button id="reset-password-btn">Update Password</button>
        <div id="reset-message" class="message"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://qzxvwoyigrrpdywvhckk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ncHOn7TNowbRZS9s-RYeuA_2m8ka_Iu';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('reset-password-btn').addEventListener('click', async () => {
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const messageDiv = document.getElementById('reset-message');
            
            if (!newPassword || !confirmPassword) {
                messageDiv.textContent = 'Please fill in both fields.';
                messageDiv.className = 'message error';
                return;
            }
            
            if (newPassword.length < 6) {
                messageDiv.textContent = 'Password must be at least 6 characters.';
                messageDiv.className = 'message error';
                return;
            }
            
            if (newPassword !== confirmPassword) {
                messageDiv.textContent = 'Passwords do not match.';
                messageDiv.className = 'message error';
                return;
            }
            
            messageDiv.textContent = 'Updating password...';
            messageDiv.className = 'message';
            
            const { error } = await supabase.auth.updateUser({ password: newPassword });
            
            if (error) {
                messageDiv.textContent = error.message;
                messageDiv.className = 'message error';
            } else {
                messageDiv.textContent = 'Password updated successfully! Redirecting to login...';
                messageDiv.className = 'message success';
                setTimeout(() => {
                    window.location.href = '/index.html';
                }, 3000);
            }
        });
    </script>
</body>
</html>
