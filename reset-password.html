<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Artheim</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .reset-container {
            max-width: 500px;
            width: 90%;
            padding: 40px 20px;
        }
        .reset-card {
            background: rgba(0, 30, 50, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
        }
        h1 {
            text-align: center;
            color: #ffd700;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #ffd700;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #4a6a8a;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #5a7a9a;
        }
        .message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }
        .message.success {
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
            border: 1px solid #4caf50;
        }
        .message.error {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
            border: 1px solid #f44336;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #ffd700;
            text-decoration: none;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-card">
            <h1>🔐 Reset Password</h1>
            
            <div class="input-group">
                <input type="password" id="new-password" placeholder="New Password (min 6 characters)">
            </div>
            
            <div class="input-group">
                <input type="password" id="confirm-password" placeholder="Confirm New Password">
            </div>
            
            <button id="reset-btn">Reset Password</button>
            
            <div id="message" class="message"></div>
            
            <div class="back-link">
                <a href="/index.html">← Back to Login</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://qzxvwoyigrrpdywvhckk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ncHOn7TNowbRZS9s-RYeuA_2m8ka_Iu';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let accessToken = null;
        
        // Extract access token from URL
        function getAccessToken() {
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            const token = hashParams.get('access_token');
            if (token) {
                console.log("Access token found");
                return token;
            }
            console.log("No access token found in URL");
            return null;
        }
        
        // Set session from the URL hash (Supabase helper)
        async function setSessionFromUrl() {
            const { data, error } = await supabase.auth.getSession();
            if (error) {
                console.error("Error getting session:", error);
            }
            console.log("Session set:", data?.session ? "Yes" : "No");
        }
        
        async function resetPassword() {
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const messageDiv = document.getElementById('message');
            
            messageDiv.innerHTML = '';
            messageDiv.className = 'message';
            
            if (!newPassword || !confirmPassword) {
                messageDiv.innerHTML = 'Please fill in both fields';
                messageDiv.className = 'message error';
                return;
            }
            
            if (newPassword.length < 6) {
                messageDiv.innerHTML = 'Password must be at least 6 characters';
                messageDiv.className = 'message error';
                return;
            }
            
            if (newPassword !== confirmPassword) {
                messageDiv.innerHTML = 'Passwords do not match';
                messageDiv.className = 'message error';
                return;
            }
            
            const btn = document.getElementById('reset-btn');
            btn.disabled = true;
            btn.textContent = 'Updating...';
            messageDiv.innerHTML = 'Updating password...';
            messageDiv.className = 'message';
            
            try {
                // First, try to set the session from the URL hash
                await setSessionFromUrl();
                
                // Update the password
                const { error } = await supabase.auth.updateUser({
                    password: newPassword
                });
                
                if (error) {
                    console.error("Update error:", error);
                    messageDiv.innerHTML = error.message || 'Failed to update password';
                    messageDiv.className = 'message error';
                } else {
                    messageDiv.innerHTML = '✅ Password updated successfully! Redirecting to login...';
                    messageDiv.className = 'message success';
                    
                    setTimeout(() => {
                        window.location.href = '/index.html';
                    }, 2000);
                }
            } catch (err) {
                console.error("Unexpected error:", err);
                messageDiv.innerHTML = 'An unexpected error occurred';
                messageDiv.className = 'message error';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Reset Password';
            }
        }
        
        // Initialize
        accessToken = getAccessToken();
        if (!accessToken) {
            document.getElementById('message').innerHTML = 'Invalid or expired reset link. Please request a new password reset.';
            document.getElementById('message').className = 'message error';
            document.getElementById('reset-btn').disabled = true;
        }
        
        document.getElementById('reset-btn').addEventListener('click', resetPassword);
        
        // Allow Enter key to submit
        document.getElementById('confirm-password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') resetPassword();
        });
    </script>
</body>
</html>
